<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest-client.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/client-apple-180.png" />
    <script>
      // Fiche d'application dès le chargement : Westaf Admin (noire) pour /admin et /ingenieur
      (function () {
        if (/^\/(admin|ingenieur)/.test(location.pathname)) {
          document.querySelector('link[rel="manifest"]').href = '/manifest-admin.webmanifest';
          document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/admin-apple-180.png';
          document.querySelector('meta[name="theme-color"]').content = '#09090a';
        }
      })();
    </script>
    <meta name="description" content="Westaf Records — studio d'enregistrement professionnel aux Almadies, Dakar. Enregistrement, mixage, mastering. Réservation en ligne." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" /></noscript>
    <title>Westaf Records — Studio d'enregistrement à Dakar</title>
  </head>
  <body>
    <div id="root"><div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#09090A">
      <img src="/logo.jpg" alt="Westaf Records" width="88" height="88" style="border-radius:9999px;box-shadow:0 0 60px rgba(242,107,33,.35);animation:bootp 1.4s ease-in-out infinite" />
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
